server:
  port: 8080

spring:
  application:
    name: skillprep
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/skillprep}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:change-this-super-secret-key-in-env-min-32-chars-long}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# AI: Ollama (local).
# For Other Models : set AI_BASE_URL, AI_MODEL and AI_API_KEY.
ai:
  base-url: ${AI_BASE_URL:http://localhost:11434/v1/chat/completions}
  model: ${AI_MODEL:llama3.2}
  api-key: ${AI_API_KEY:}
